[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inflation-fx-etl"
version = "0.1.0"
description = "ETL pipeline: inflation and exchange rates of 8 countries against the euro"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "psycopg[binary]>=3.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-requests", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.setuptools.package-data]
etl = ["py.typed"]

[tool.pytest.ini_options]
markers = ["db: needs the PostgreSQL test database"]
addopts = "--cov=etl --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
